name: Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # -json 模式恒定 exit 0；按「是否已有修复版」分级：
          # 有修复版的调用级漏洞 → 硬失败（可执行：升级即可）；
          # 无修复版（Fixed in: N/A，如 lib/pq GO-2026-616x）→ warning 留痕不阻塞，
          # 上游一旦发布修复版，本门禁自动恢复硬性。
          govulncheck -json ./... > /tmp/govulncheck.json
          jq -rs '[ .[] | select(.finding != null) | .finding
                    | select(.trace[0].function != null)
                    | {osv, fixed: (.fixed_version // "")} ] | unique' \
            /tmp/govulncheck.json > /tmp/findings.json
          cat /tmp/findings.json
          TOTAL=$(jq 'length' /tmp/findings.json)
          FIXABLE=$(jq '[ .[] | select(.fixed != "") ] | length' /tmp/findings.json)
          echo "call-level findings: ${TOTAL}, with fix available: ${FIXABLE}"
          if [ "${FIXABLE}" -gt 0 ]; then
            echo "::error::${FIXABLE} reachable vulnerabilities have released fixes; upgrade the affected modules"
            exit 1
          fi
          if [ "${TOTAL}" -gt 0 ]; then
            echo "::warning::${TOTAL} reachable vulnerabilities have no released fix yet (non-blocking, tracked)"
          fi

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        working-directory: frontend
        run: |
          pnpm audit --prod --audit-level=high --json > audit.json || true
      - name: Check audit exceptions
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml
